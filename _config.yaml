title: 📚 Kaja.io Docs
description: Kaja is a customisable AI agentic harness. Use it hosted or fully local, from the terminal, Telegram or your own website.
repository: kajaio/kaja
url: https://docs.kaja.io
permalink: pretty
heading_anchors: false
enable_copy_code_button: true

aux_links:
  "Source on GitHub":
    - "//github.com/kajaio/kaja"
aux_links_new_tab: true

gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/kajaio/kaja"
gh_edit_branch: "main"
gh_edit_source: docs
gh_edit_view_mode: "edit"

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap

remote_theme: just-the-docs/just-the-docs

mermaid:
  version: "11.15.0"

target-blank:
  noopener: false

color_scheme: dark
favicon_ico: /images/favicon.ico

callouts:
  note:
    title: Note
    color: purple
  warning:
    title: Warning
    color: red
