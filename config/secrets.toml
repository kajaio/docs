# The only file you should need to hand-edit for credentials. `kaja doctor`
# asks for anything missing, tests it, and saves it here.

# Telegram bot token, for `kaja telegram`. It only answers the Telegram users in owner_ids,
# which `kaja telegram` fills in when someone sends it the pairing code it prints.
# [telegram]
# bot_token = "123456:ABC-DEF..."
# owner_ids = [123456789]

# Credentials for models.toml's [providers.<name>] tables, keyed the same way.
# [providers]
#   [providers.fireworks]
#   api_key = "fw_YourSecretKey"
#
#   [providers.xai]
#   api_key = "xai-YourSecretTwitterKey"
#
#   [providers.openrouter]
#   api_key = "sk-or-v1-YourSecretKey"

# API keys for abilities (marketplace/abilities/<name>/), keyed by ability
# name, one for all its parts. Each manifest's `auth` says which header, query
# parameter or env var the key goes into. Without its key an ability is off.
# [abilities]
#   [abilities.web-search]
#   api_key = "BSA..."
