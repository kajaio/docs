# Kaja models. Each [models.<id>] names the API it runs on (`provider`, a [providers.*] table) and
# what it can be used for (`tasks`); a task no model lists is off. Order matters: each task uses the
# first model in this file that lists it, so to switch, comment that one out or move another above it.
# The later ones are kept for a persona's [models] pin, or for `kaja doctor` to fall back to when one
# stops answering. `model` is the literal name sent to the API.
# Provider API keys live in secrets.toml's [providers.<name>] tables, keyed the same way.

[providers]
  [providers.fireworks]
  base_url = "https://api.fireworks.ai/inference/v1"


  [providers.xai]
  base_url = "https://api.x.ai/v1"


  [providers.speaches]
  base_url = "http://localhost:8000"  # local server, no key needed


[models]
  [models.minimax-m3]
  model    = "accounts/fireworks/models/minimax-m3"
  provider = "fireworks"
  tasks    = [
    "chat"
  ]


  [models.qwen3-embedding-8b]
  model    = "accounts/fireworks/models/qwen3-embedding-8b"
  provider = "fireworks"
  tasks    = [
    "embedding"
  ]


  [models.qwen3-reranker-8b]
  model    = "accounts/fireworks/models/qwen3-reranker-8b"
  provider = "fireworks"
  tasks    = [
    "rerank"
  ]


  [models.grok-imagine-image]
  model    = "grok-imagine-image"
  provider = "xai"
  tasks    = [
    "image-generation"
  ]


  [models.kokoro-82m-v1-0-onnx-fp16]
  model    = "speaches-ai/Kokoro-82M-v1.0-ONNX-fp16"
  provider = "speaches"
  tasks    = [
    "tts"
  ]


  [models.faster-whisper-small]
  model    = "Systran/faster-whisper-small"
  provider = "speaches"
  tasks    = [
    "stt"
  ]


  [models.glm-5p3-flash]
  model    = "accounts/fireworks/models/glm-5p3-flash"
  provider = "fireworks"
  tasks    = [
    "summarize"
  ]
