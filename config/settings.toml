[preferences]
thinking = false
# How tool calls show: "minimal" (default) keeps one live row in the chat and leaves a
# one-line summary per turn; "verbose" lists every call; "corner" shows the current call
# in the header's top-right corner and nothing in the chat.
# toolDisplay = "minimal"
# Lines of a code block, or of a command awaiting approval, shown before "… N more lines".
# codePreviewLines = 5
sounds   = true
voice    = false
locale   = "en-GB"
# Which backend `kaja` starts: "cloud" (the Kaja API) or "local" (the agent loop against
# your own provider in models.toml). Written by the setup wizard; `--cloud`/`--local`
# override it for a single run. Without it, a usable chat model means local.
# mode = "local"
# Modifier key for the help/persona hotkeys: "alt" (default) or "ctrl". No choice is
# universal in a terminal — alt can type special characters instead of acting as a
# modifier on some macOS terminals, ctrl can collide with host-app shortcuts (e.g. VS
# Code's integrated terminal reserves several ctrl+<letter> combos). Pick whichever
# works cleanly in your terminal.
# hotkeyModifier = "alt"
# Colour theme: "auto" (default) asks the terminal for its background colour and picks
# "dark" or "light" to match, then follows the terminal when it switches (where it reports
# that); set one of those if your terminal doesn't answer. "terminal" paints with the
# terminal's own colour scheme instead, so any scheme you load there is Kaja's too.
# theme = "auto"
# DANGEROUS, for development: approves every shell command and tool call without asking,
# rm -rf and sudo included, here, in the local Telegram bot and for the cloud's tool
# approvals. Read-only folders and the files read_file never opens stay off-limits.
# yolo = false

# Fetching skills, personas, tools and MCP servers from the online marketplace (needs git).
# enabled = false means Kaja never goes online for abilities: `kaja abilities update` refuses and
# nothing is pulled at startup. What is already in ~/.config/kaja/marketplace/ still loads.
# autoFetch pulls at startup when the last sync is over a day old; changes apply on the next launch.
# url and ref say where to fetch from (a git URL or a local path, and a branch or tag), for testing
# your own marketplace changes; they default to the Kaja repo's main branch (with KAJA_PROFILE=dev, to
# the checkout Kaja runs from, on its current branch).
# [marketplace]
# enabled = true
# autoFetch = true
# url = "https://github.com/kajaio/kaja.git"
# ref = "main"

# Long conversations: once the chat model's context is this full (0.3-0.95 of its window), the older
# messages are summarised so the conversation fits. The summary is written by models.toml's first model
# listing summarize, else by the chat model. `/compact` does it on demand.
# [context]
# compact_at = 0.8

# Speech-to-text (Speaches AI server).
# [stt]
# speachesUrl = "http://localhost:8000"
# language = "en"

# Text-to-speech (Speaches AI server).
# [tts]
# speachesUrl = "http://localhost:8000"
# voice = "af_heart"

# Overrides the default XDG data location for the memory database.
# [memory]
# dbPath = "/home/user/.local/share/kaja/memory.sqlite"
